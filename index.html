<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Phat Tran Vu Hoa</title>
    <link
      rel="shortcut icon"
      href="./assets/images/logo.ico"
      type="image/x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #121212;
        --card-bg: #1e1e1f;
        --text-main: #fafafa;
        --text-muted: #d6d6d6;
        --accent: #ffdb70;
        --border: #383838;
        --hover-bg: #2b2b2c;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: "Poppins", sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 40px 20px;
      }

      .container {
        width: 100%;
        max-width: 480px;
        text-align: center;
        animation: fadeIn 0.8s ease backwards;
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--border);
        margin-bottom: 15px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: transform 0.3s ease;
      }

      .avatar:hover {
        transform: scale(1.05);
        border-color: var(--accent);
      }

      h1 {
        font-size: 26px;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-main);
      }

      p.title {
        font-size: 14px;
        color: var(--text-muted);
        background: var(--card-bg);
        display: inline-block;
        padding: 6px 16px;
        border-radius: 20px;
        border: 1px solid var(--border);
        margin-bottom: 30px;
      }

      .links-wrapper {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .link-item {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background-color: var(--card-bg);
        color: var(--text-main);
        text-decoration: none;
        padding: 16px 20px;
        border-radius: 14px;
        border: 1px solid var(--border);
        font-size: 16px;
        font-weight: 500;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .link-item::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          120deg,
          transparent,
          rgba(255, 219, 112, 0.1),
          transparent
        );
        transform: translateX(-100%);
        transition: 0.5s;
      }

      .link-item:hover::before {
        transform: translateX(100%);
      }

      .link-item:hover {
        background-color: var(--hover-bg);
        border-color: var(--accent);
        color: var(--accent);
        transform: translateY(-3px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      }

      .link-item ion-icon {
        font-size: 22px;
        position: absolute;
        left: 20px;
      }

      .section-title {
        font-size: 20px;
        font-weight: 600;
        margin: 45px 0 20px 0;
        text-align: left;
        border-bottom: 1px solid var(--border);
        padding-bottom: 10px;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .section-title ion-icon {
        color: var(--accent);
      }

      .cert-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .cert-item {
        background-color: var(--card-bg);
        padding: 18px;
        border-radius: 14px;
        border: 1px solid var(--border);
        text-align: left;
        transition:
          transform 0.3s ease,
          border-color 0.3s ease;
        position: relative;
      }

      .cert-item:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
      }

      .cert-title {
        font-weight: 600;
        font-size: 16px;
        margin-bottom: 6px;
        color: var(--text-main);
      }

      .cert-desc {
        font-size: 14px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        src="./assets/images/my-avatar.jpg"
        alt="Phat Tran Vu Hoa"
        class="avatar"
      />
      <h1>Phat Tran Vu Hoa</h1>

      <div class="links-wrapper">

        </a>

          Điện thoại
        </a>
        <a

          target="_blank"

        >

          Facebook
        </a>
        <a
          href="https://github.com/coderishibuki"
          target="_blank"
          class="link-item"
        >
          <ion-icon name="logo-github"></ion-icon>

        </a>
        <a

          target="_blank"
          class="link-item"

        <a href="#" target="_blank" class="link-item">

      </div>

      <h2 class="section-title">
        <ion-icon name="ribbon-outline"></ion-icon>
        Chứng chỉ

      <div class="cert-list">

        <div class="cert-item">

        </div>

    </div>

    <script

      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"

  </body>
